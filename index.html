<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="ASTRE — Fashion with details. Timeless. Refined. Effortless.">
  <meta property="og:title" content="ASTRE — Fashion with details.">
  <meta property="og:description" content="Timeless. Refined. Effortless.">
  <title>ASTRE — Fashion with details.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="experience">

    <div class="noise" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <header class="topbar">
      <span class="micro-brand">ASTRE</span>
      <span class="micro-status"><span class="status-dot"></span> EST. 2026</span>
    </header>

    <section class="hero" aria-label="ASTRE introduction">
      <div class="halo halo-one" aria-hidden="true"></div>
      <div class="halo halo-two" aria-hidden="true"></div>

      <div class="orbit orbit-one" aria-hidden="true"></div>
      <div class="orbit orbit-two" aria-hidden="true"></div>

      <div class="lens" aria-hidden="true"></div>

      <div class="hero-content">
        <div class="logo-stage">
          <div class="logo-glow"></div>
          <img class="logo" src="logo.jpg" alt="ASTRE — Fashion with details.">
        </div>

        <div class="gold-rule">
          <span></span>
          <i>✦</i>
          <span></span>
        </div>

        <p class="label reveal reveal-delay-1">THE HOUSE OF ASTRE</p>

        <h1 class="reveal reveal-delay-2">
          <span>IS</span>
          <em>ARRIVING.</em>
        </h1>

        <p class="statement reveal reveal-delay-3">
          A new standard of everyday refinement.
        </p>

        <div class="values reveal reveal-delay-4" aria-label="ASTRE values">
          <span>TIMELESS</span>
          <b>•</b>
          <span>REFINED</span>
          <b>•</b>
          <span>EFFORTLESS</span>
          <b>•</b>
          <span>OLD MONEY</span>
        </div>
      </div>

      <div class="edge-note edge-left">DETAILS DEFINE THE DIFFERENCE.</div>
      <div class="edge-note edge-right">FASHION WITH DETAILS.</div>

      <div class="scroll-mark" aria-hidden="true">
        <span></span>
      </div>
    </section>

    <footer class="footer">
      <span>© 2026 ASTRE</span>
      <span>THE BEGINNING OF SOMETHING TIMELESS.</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
