<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASTRE — Fashion with details.</title>
<meta name="description" content="ASTRE — Fashion with details. Timeless. Refined. Effortless.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<main>

  <section class="hero" id="hero">

    <div class="light-field" aria-hidden="true">
      <div class="light-field__sheen"></div>
    </div>

    <div class="hero__inner">

      <figure class="hero__mark" data-reveal="mark">
        <img src="logo.png" alt="ASTRE — Fashion with details." width="1095" height="336">
      </figure>

      <p class="hero__tagline" data-reveal="tagline">Fashion with details.</p>

      <div class="hairline" data-reveal="line" aria-hidden="true"></div>

      <div class="hero__statement" data-reveal="statement">
        <p class="statement__eyebrow">The house of Astre</p>
        <p class="statement__headline">is arriving<span class="statement__dot">.</span></p>
        <p class="statement__sub">A new standard of everyday refinement.</p>
      </div>

    </div>

    <div class="hero__values" data-reveal="values">
      <span>Timeless</span>
      <i></i>
      <span>Refined</span>
      <i></i>
      <span>Effortless</span>
      <i></i>
      <span>Old&nbsp;Money</span>
    </div>

    <div class="scroll-cue" data-reveal="cue" aria-hidden="true">
      <span>Scroll</span>
      <div class="scroll-cue__line"></div>
    </div>

  </section>

  <section class="philosophy" id="philosophy">
    <div class="philosophy__inner">
      <h2 class="philosophy__title">Details define<br>the difference.</h2>
      <p class="philosophy__text">
        ASTRE is built around the belief that true style doesn't
        demand attention. It earns it.
      </p>
    </div>
    <footer class="philosophy__footer">
      <span>&copy; <span id="year"></span> ASTRE</span>
    </footer>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
